name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The `6.4.0` literals below are **deliberate**, not a duplicated pin. `.swift-version` names the toolchain
# swift-wire is developed against; these jobs are a *regression check* that the package still compiles on
# the current release toolchain. Today the two coincide — 6.4.0 is released, and the package is developed
# against it — but when `.swift-version` next moves to a pre-release snapshot, these literals stay where
# they are. They move only when the released Swift does.
#
# swift-syntax 604 is released alongside Swift 6.4, so the declared range spans two majors (603..<605) and
# the SwiftSyntaxMatrix job below pins each in turn. The separate pinned-snapshot job that used to track the
# 604 line via its release/6.4.x branch is gone: SPM resolves the tagged release now.
#
# Toolchains come from swift-wire/setup-swift, the family's own action over Swiftly. It replaced
# SwiftyLab/setup-swift when that action's tagged releases could not install 6.4.0, and it also covers
# macOS, where no preinstalled Xcode on the runner image carries Swift 6.4. It installs the toolchain's
# own system dependencies, which is why no job here has an apt-get step for them.
jobs:
  BuildAndTestLinux:
    name: Linux ${{ matrix.os }} / Swift ${{ matrix.swift-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        swift-version: ["6.4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Install unzip for SwiftLint
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Build
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Build tests
        # -v captures compiler invocations for SwiftLint analyze; redirected
        # to file to keep the CI log readable.
        run: swift build --build-tests -v > build.log 2>&1
      - name: Run tests
        run: swift test --skip-build
      - name: Install SwiftLint
        # SwiftLint's prebuilt Linux binary requires a GLIBC only present on 24.04+
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint unused imports
        if: matrix.os == 'ubuntu-24.04'
        run: swiftlint analyze --strict --quiet --compiler-log-path build.log

  BuildAndTestMacOS:
    name: macOS 26 / Swift ${{ matrix.swift-version }}
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.4.0"]
    # macos-26 rather than macos-15: the 6.4 toolchain pairs with the Xcode 27 SDK, and the older image's
    # SDK is the mismatch wire-configuration already hit (apple/swift-configuration#178).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Build
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Run tests
        run: swift test

  CompositionHarness:
    name: Composition harness (multi-module gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Run composition harness
        # Multi-module composition gate (iteration 7g). Runs outside
        # `swift test` because the macro-using harness library depends on
        # swift-wire — a fixture in swift-wire's own tests would cycle.
        run: bash CompositionHarness/run-harness.sh

  AdapterHarness:
    name: Adapter harness (adapter-contract gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Run adapter harness
        # Adapter-contract gate (iteration 8). Runs outside `swift test`
        # because the macro-using adapter package depends on swift-wire — a
        # fixture in swift-wire's own tests would cycle.
        run: bash AdapterHarness/run-adapter-harness.sh

  InjectionRewriteHarness:
    name: Injection-rewrite harness (.rewritesInjection gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Run injection-rewrite harness
        # Outside `swift test`: the fixture adapter depends on swift-wire, so a package inside these
        # tests would cycle. The adapter is synthetic, so this gate needs no external repo.
        run: bash InjectionRewriteHarness/run-injection-rewrite-harness.sh

  ManifestHarness:
    name: Manifest harness (plugin-output gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Run manifest harness
        # Plugin-output gate. Pins the undocumented SPM behaviour that
        # deferred manifest-based discovery would rest on — the plugin-output layout and llbuild's
        # ordering on a declared `inputFiles` edge — so the finding in
        # #338 fails loudly if the toolchain changes rather than
        # rotting. Neither package depends on swift-wire.
        run: bash ManifestHarness/run-manifest-harness.sh

  GraphInputsHarness:
    name: Graph-inputs harness (@GraphInputs gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Run graph-inputs harness
        # `@GraphInputs` changes `Wire.bootstrap`'s signature for its whole
        # module, so its fixture needs a graph of its own rather than sharing
        # IntegrationTests'.
        run: bash GraphInputsHarness/run-graph-inputs-harness.sh

  Documentation:
    name: Documentation (DocC gate)
    # The catalog is written for 6.4's DocC, which accepts type-signature disambiguation for overloads
    # (`Contributes(to:)-(CollectedKey<Element>)`) where 6.3's wanted USR hashes. Now that 6.4 is the
    # release the other jobs pin, this job needs nothing special.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Build documentation, failing on any warning
        # The catalog's articles reference symbols by name, so a renamed or removed macro breaks a
        # link rather than a build — silently, and only for a reader. `--warnings-as-errors` is what
        # makes the articles a gate rather than prose.
        run: swift package generate-documentation --target Wire --warnings-as-errors

  GoldenHarness:
    name: Golden harness (generated-output gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: "6.4.0"
      - name: Run golden harness
        # Byte-identical generated output over the IntegrationTests corpus. The
        # invariant reachability pruning and noncopyable bindings are
        # both written against: a graph none of their conditions apply to must
        # generate exactly what it generated before. A diff is not automatically
        # a bug — it is an unintended change until someone re-records it.
        run: bash GoldenHarness/run-golden-harness.sh

  SwiftSyntaxMatrix:
    name: swift-syntax ${{ matrix.swift-syntax-major }}.x / Swift ${{ matrix.swift-version }}
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.4.0"]
        # Every major the declared range admits (floor + ceiling = 603..<605). SPM resolves to the
        # newest on its own, so without this the floor major is never actually built.
        swift-syntax-major: ["603", "604"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Pin swift-syntax to ${{ matrix.swift-syntax-major }}.x
        # Narrow the declared range to a single major so SPM resolves
        # to the matrix's swift-syntax version. Targets the exact range
        # string in Package.swift; if that string changes the sed
        # needs to follow.
        run: |
          next=$((${{ matrix.swift-syntax-major }} + 1))
          sed -i 's|"603.0.0"..<"605.0.0"|"${{ matrix.swift-syntax-major }}.0.0"..<"'${next}'.0.0"|' Package.swift
          grep swift-syntax Package.swift
      - name: Resolve dependencies
        run: swift package update
      - name: Build
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Run tests
        run: swift test

  StaticLinuxSDK:
    name: Static Linux SDK (cross-compile to aarch64-musl)
    runs-on: ubuntu-24.04
    # The image and the SDK bundle must be the same Swift release: an SDK only installs against the
    # toolchain it was built for, so these two literals move together.
    container:
      image: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install Static Linux SDK
        run: swift sdk install https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e
      - name: Cross-compile for ARM64 Linux
        run: swift build -c release --swift-sdk aarch64-swift-linux-musl

  SwiftLint:
    name: SwiftLint 0.63.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        # Pin the same SwiftLint the BuildAndTest job's `analyze` step
        # uses, so CI matches a modern local install. The prebuilt Linux
        # binary needs the GLIBC on ubuntu-24.04+.
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        run: swiftlint lint --quiet

  SwiftFormat:
    name: swift-format / Swift ${{ matrix.swift-version }}
    strategy:
      matrix:
        swift-version: ["6.4.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Run swift-format
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  Coverage:
    name: Coverage / Swift ${{ matrix.swift-version }}
    strategy:
      matrix:
        swift-version: ["6.4.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Run tests with coverage
        run: swift test --enable-code-coverage --xunit-output test-results.xml
      - name: Convert to LCOV
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -path '*/codecov/*' | head -1)
          XCTEST=$(find "$BIN_PATH" -name '*.xctest' -type f | head -1)
          llvm-cov export \
            -format=lcov \
            -instr-profile="$PROFDATA" \
            "$XCTEST" \
            -ignore-filename-regex=".build|Tests" \
            > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.lcov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: test-results.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  LicenceHeaders:
    name: Licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Pure git and shell, so this gate needs no toolchain and answers in seconds. It is a
      # separate job rather than a step on an existing one because a missing header is not a
      # build error: nothing else in the toolchain looks, so without this the omission is silent.
      - name: Check SPDX headers
        run: ./Scripts/check-license-headers.sh
